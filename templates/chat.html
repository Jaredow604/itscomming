<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's Coming - Terminal Oráculo</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --accent-green: #00ffcc;
            --text-color: #e0e6ed;
            --border-color: #1f2833;
            --box-bg: #151a21;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 8px 32px rgba(0, 255, 204, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #0f1218;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            color: var(--accent-green);
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 1px;
        }

        .chat-header span {
            font-size: 0.75rem;
            color: #64748b;
            background: rgba(0, 255, 204, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 4px;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .message.user {
            align-self: flex-end;
            background: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(0, 255, 204, 0.03);
            border-left: 3px solid var(--accent-green);
            color: var(--text-color);
        }

        .input-container {
            display: flex;
            padding: 20px;
            background: #0f1218;
            border-top: 1px solid var(--border-color);
        }

        .input-container input {
            flex: 1;
            background: #0b0c10;
            border: 1px solid #334155;
            color: var(--accent-green);
            padding: 15px;
            font-family: inherit;
            font-size: 0.95rem;
            border-radius: 4px 0 0 4px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-container input::placeholder {
            color: #475569;
        }

        .input-container input:focus {
            border-color: var(--accent-green);
        }

        .input-container button {
            background: transparent;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 0 24px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            transition: all 0.2s ease-in-out;
        }

        .input-container button:hover {
            background: var(--accent-green);
            color: #0b0c10;
        }

        .loading {
            align-self: flex-start;
            color: var(--accent-green);
            font-style: italic;
            font-size: 0.85rem;
            display: none;
            padding: 0 24px 10px 24px;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0);}
            40% { color: var(--accent-green); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0);}
            60% { text-shadow: .25em 0 0 var(--accent-green), .5em 0 0 rgba(0,0,0,0);}
            80%, 100% { text-shadow: .25em 0 0 var(--accent-green), .5em 0 0 var(--accent-green);}
        }
        
        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--box-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-green);
        }
        /* Render de Markdown y Spacing Base */
        .message.bot p { margin-top: 0; margin-bottom: 0.8rem; }
        .message.bot p:last-child { margin-bottom: 0; }
        .message.bot ul, .message.bot ol { margin-top: 0.5rem; margin-bottom: 0.8rem; padding-left: 20px; }
        .message.bot li { margin-bottom: 0.4rem; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            >_ IT'S COMING // LLAMA 3.3 AGENT
            <span>STATUS: ONLINE_QUANT_MODE</span>
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message bot">
                Iniciando pipeline RAG y Agent LLM...<br>
                Conectado a PostgreSQL: itscoming_db.<br>
                > Oráculo inicializado. Ingresa los equipos para análisis:
            </div>
        </div>
        <div class="loading" id="loadingIndicator">El Oráculo está calculando</div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Ej: Manchester City vs Arsenal..." autocomplete="off">
            <button id="sendBtn">EJECUTAR</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            
            if (sender === 'bot') {
                // Parse the markdown securely via marked
                msgDiv.innerHTML = marked.parse(text);
            } else {
                msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            }
            
            chatBox.appendChild(msgDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            
            loadingIndicator.style.display = 'block';
            scrollToBottom();

            try {
                const response = await fetch('/api/chat/lcel/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                loadingIndicator.style.display = 'none';
                
                if (data.reply) {
                    addMessage(data.reply, 'bot');
                } else if (data.error) {
                    addMessage('ERROR: ' + data.error, 'bot');
                }
            } catch (error) {
                loadingIndicator.style.display = 'none';
                addMessage('CRITICAL_ERROR: Backend inalcanzable. Verifique la conexión.', 'bot');
                console.error(error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
